repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: semlf
        name: semlf semantic linefeeds (self-check)
        entry: uv run semlf --staged
        language: system
        pass_filenames: false
