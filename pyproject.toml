[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semlf"
description = "A diff-aware prose guardrail: one-thought-per-line linefeeds in comments, docstrings, and Markdown"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Arlo Liu"}]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/arloliu/semantic-linefeeds"

[project.scripts]
semlf = "semlf.cli:main"

[tool.setuptools]
packages = ["semlf"]
package-dir = {"semlf" = "cli/semlf", "" = "scripts"}
py-modules = ["check_linefeeds"]

[tool.setuptools.dynamic]
version = {attr = "check_linefeeds.__version__"}

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = ["tests/fixtures", "tests/extractor", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"scripts/install.py" = ["E402"]

[dependency-groups]
dev = [
    "pip>=26.0.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.16.3",
    "setuptools>=82.0.1",
]
