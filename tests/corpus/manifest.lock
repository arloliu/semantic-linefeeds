  "reason": "the markup opener is withdrawn, so the three units it moved to detected return to accepted_miss, which is the status they carried before this branch. Reading a lower line through its markup was tried across four review rounds and produced a new false-positive class in every one: a markup-wrapped connector, a markup-wrapped capitalised word, a whole-row bold label, a full-width colon, a colonless bold label, a bare label above a code span, and a two-word label above one. The distinction the gate needed is whether the upper line holds a verb, since a field label and a stranded governing word both close on a lowercase noun, and that is the grammar this project leaves to the judgment layer. The recall is given up deliberately and the miss is recorded in a test"
}
