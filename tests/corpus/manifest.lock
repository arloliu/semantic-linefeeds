  "reason": "the manifest gains a repair_admission section, and no label changes. It preregisters what a widened automatic repair must clear before any repair has been elicited: the scored denominator, the rule that a class is measured on the exact class sets it activates, an absolute floor of 0.80 on each activated stratum's Wilson-95 lower bound taken stratum by stratum rather than pooled, the conditions under which a stratum can be rated at all, the requirement that the shipped class be scored through the same algorithm, and three conditions that refuse a class however well it scores. Nothing in it touches what counts as a violation or how a unit was labeled, so every existing unit keeps the status it carries"
